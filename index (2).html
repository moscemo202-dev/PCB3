const KEY='PCB_LAYOUT_MISSION_SYNC_V1';
let state={version:1,completed:0,totalScore:0,scores:{},outcomes:{},codes:[]};
const panels=[1,2,3,4,5].map(i=>document.getElementById('game'+i));
function read(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&typeof x==='object')state={...state,...x,scores:{...(x.scores||{})},outcomes:{...(x.outcomes||{})},codes:Array.isArray(x.codes)?x.codes:[]};}catch(e){} state.completed=Math.max(0,Math.min(5,Number(state.completed)||0));state.totalScore=Object.values(state.scores).reduce((a,b)=>a+(Number(b)||0),0);}
function write(){state.totalScore=Object.values(state.scores).reduce((a,b)=>a+(Number(b)||0),0);try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}render()}
function decode(b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
function initFrames(){GAME_DATA.forEach(g=>{const frame=document.getElementById('frame'+g.id);const html=decode(g.data);const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));frame.src=url;frame.dataset.url=url})}
function render(){document.getElementById('totalScore').textContent=state.totalScore;document.getElementById('chips').innerHTML=[1,2,3,4,5].map(i=>`<span class="chip ${state.completed>=i?'done':''} ${current===i?'active':''}">${state.completed>=i?'✓':'○'} เกม ${i}</span>`).join('');document.getElementById('cards').innerHTML=GAME_DATA.map(g=>{const unlocked=g.id===1||state.completed>=g.id-1;const done=state.completed>=g.id;return `<div class="gamecard ${unlocked?'':'locked'}"><b>${done?'✅':'🎮'} ${g.name}</b><p>${done?'จบแล้ว • คะแนน '+(state.scores[g.id]??0):unlocked?'พร้อมเล่น':'🔒 ต้องจบเกม '+(g.id-1)+' ก่อน'}</p><button ${unlocked?'':'disabled'} onclick="showGame(${g.id})">${done?'เปิดเกม':'เริ่มเกม'}</button></div>`}).join('')}
let current=0;
function showHome(){read();current=0;panels.forEach(p=>p.classList.remove('active'));document.getElementById('home').classList.add('active');render()}
function showGame(n){read();if(n>1&&state.completed<n-1){showGame(n-1);return}current=n;document.getElementById('home').classList.remove('active');panels.forEach((p,i)=>p.classList.toggle('active',i===n-1));const f=document.getElementById('frame'+n);f.src=f.src;render();try{f.contentWindow.focus()}catch(e){}}
function reset(){state={version:1,completed:0,totalScore:0,scores:{},outcomes:{},codes:[]};write();GAME_DATA.forEach(g=>{const f=document.getElementById('frame'+g.id);f.src=f.src});showHome();}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='mission-next'){read();const n=Number(d.game);if(n>=1&&n<=5){showGame(n)}}else if(d.type==='mission-reset'){reset()} });
document.getElementById('homeBtn').onclick=showHome;document.getElementById('resetBtn').onclick=()=>{if(confirm('รีเซ็ตความคืบหน้าทั้ง 5 เกมใช่หรือไม่?'))reset()};
read();initFrames();render();
</script>
